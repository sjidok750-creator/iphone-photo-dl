name: install-check

# 공개 주소의 설치 한 줄(README 그대로)이 깨끗한 Mac 에서 되는지 손으로 돌려 보는 검사.
on:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        # macos-26 = macOS Tahoe (맥북 네오 등 최신 Mac 과 같은 macOS)
        os: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Install with the README one-liner
        env:
          IPHONE_PHOTO_DL_NO_LAUNCH: "1"
        run: |
          uname -m
          sw_vers -productVersion
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
      - name: Run installed app binary
        run: |
          B="$HOME/.iphone-photo-dl/bin/iphone-photo-dl"
          file -L "$B"
          "$B" --version
          "$B" --self-test
          set +e
          "$B" --list --timeout 3
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 3
      - name: Open installed app window
        run: |
          open "/Applications/아이폰 사진 받기.app"
          sleep 8
          pgrep -fl "MacOS/iphone-photo-dl" || { echo "앱 창이 떠 있지 않음"; exit 1; }
          screencapture -x "window-${{ matrix.os }}.png" || true
          pkill -f "MacOS/iphone-photo-dl" || true
          tail -n 5 "$HOME/Library/Logs/iphone-photo-dl.log"
      - uses: actions/upload-artifact@v4
        with:
          name: window-${{ matrix.os }}
          path: window-${{ matrix.os }}.png
