name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 10.15 를 공식 지원하는 마지막 Xcode 가 16 이다(Xcode 26 은 11 이상, 27 은 12 이상).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$X" ]; then echo "Xcode 16 이 없음"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version
          xcodebuild -version | grep -q "^Xcode 16"

      - name: Shell syntax
        run: |
          bash -n build.sh
          bash -n install.sh

      - name: Build (universal, macOS 10.15+)
        run: bash build.sh universal

      - name: Check binary
        run: |
          B=build/iphone-photo-dl
          lipo -info "$B"
          lipo -info "$B" | grep -q x86_64
          lipo -info "$B" | grep -q arm64
          echo "--- 최소 macOS (x86_64 조각)"
          otool -arch x86_64 -l "$B" | grep -A4 LC_BUILD_VERSION | tee /tmp/minos.txt
          grep -q "minos 10.15" /tmp/minos.txt
          echo "--- 연결 라이브러리 (x86_64 조각)"
          otool -arch x86_64 -L "$B" | tee /tmp/libs.txt
          if grep -E "_StringProcessing|_Concurrency|libswift_RegexParser" /tmp/libs.txt; then
            echo "macOS 10.15 에 없는 라이브러리가 연결됨"; exit 1
          fi

      - name: Self test (arm64)
        run: build/iphone-photo-dl --self-test

      - name: Self test (x86_64 via Rosetta)
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 build/iphone-photo-dl --self-test
          else
            echo "Rosetta 없음 — x86_64 실행 시험 건너뜀"
          fi

      - name: Smoke test without iPhone (expect exit 3)
        run: |
          build/iphone-photo-dl --version
          build/iphone-photo-dl --help | head -n 5
          set +e
          build/iphone-photo-dl --list --timeout 3 "$RUNNER_TEMP/out"
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 3
          test ! -e "$RUNNER_TEMP/out"   # --list 는 아무것도 만들지 않는다

      - name: Package
        run: |
          tar -czf build/iphone-photo-dl-macos.tar.gz -C build iphone-photo-dl
          shasum -a 256 build/iphone-photo-dl-macos.tar.gz | tee build/SHA256.txt

      - name: Install script test (local package)
        run: |
          IPHONE_PHOTO_DL_ASSET_URL="file://$PWD/build/iphone-photo-dl-macos.tar.gz" bash install.sh
          "$HOME/.iphone-photo-dl/bin/iphone-photo-dl" --version
          L="$HOME/Desktop/아이폰 사진 받기.command"
          [ -x "$L" ] || L="$HOME/.iphone-photo-dl/아이폰 사진 받기.command"
          test -x "$L"
          bash -n "$L"
          head -n 3 "$L"

      - uses: actions/upload-artifact@v4
        with:
          name: iphone-photo-dl-macos
          path: |
            build/iphone-photo-dl-macos.tar.gz
            build/SHA256.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/iphone-photo-dl-macos.tar.gz build/SHA256.txt \
            --title "$GITHUB_REF_NAME" \
            --notes "macOS 10.15 이상(Intel·Apple Silicon 공용). 설치: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash"
